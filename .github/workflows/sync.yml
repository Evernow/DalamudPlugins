name: Sync pluginmaster

on:
  schedule:
    - cron: '17 * * * *'      # hourly
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/Sync.ps1'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync from plugin releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Sync.ps1

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "no changes"; exit 0 }
          git commit -m "Sync pluginmaster.json"
          git push
